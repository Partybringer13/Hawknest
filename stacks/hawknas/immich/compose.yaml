#version: "3.9"

networks:
  proxy:
    external: true
  immich:
    driver: bridge

services:
  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - /mnt/.ix-apps/app_mounts/immich/redis:/data
    networks:
      - immich
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  immich-db:
    image: tensorchord/pgvecto-rs:pg16-v0.2.0
    container_name: immich-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=immich
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=immich
    volumes:
      - /mnt/.ix-apps/app_mounts/immich/postgres:/var/lib/postgresql/data
    networks:
      - immich
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

 immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-db:
        condition: service_healthy
    environment:
      # These two must be first — critical
      - REDIS_URL=redis://immich-redis:6379
      - DATABASE_URL=postgresql://immich:immich@immich-db:5432/immich

      # Secondary fallback vars (redundant but harmless)
      - DB_HOST=immich-db
      - DB_PORT=5432
      - DB_USERNAME=immich
      - DB_PASSWORD=immich
      - DB_DATABASE_NAME=immich
      - REDIS_HOST=immich-redis
      - REDIS_PORT=6379
      - IMMICH_LOG_LEVEL=debug
      - NODE_ENV=production

    volumes:
      - /mnt/.ix-apps/app_mounts/immich/config:/config
      - /mnt/HawkPool/Media/Center/photos:/usr/src/app/upload:rw
    networks:
      - immich
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.immich.rule=Host(`immich.hawknest.quest`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.services.immich.loadbalancer.server.port=3001"
      - "traefik.http.routers.immich.middlewares=secureHeaders@file"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  immich-ml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-ml
    restart: unless-stopped
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-db:
        condition: service_healthy
    environment:
      - REDIS_HOST=immich-redis
      - DB_HOST=immich-db
      - DB_PORT=5432
      - DB_USERNAME=immich
      - DB_PASSWORD=immich
      - DB_DATABASE_NAME=immich
    volumes:
      - /mnt/.ix-apps/app_mounts/immich/config:/config
      - /mnt/HawkPool/Media/Center/photos:/usr/src/app/upload
    networks:
      - immich
