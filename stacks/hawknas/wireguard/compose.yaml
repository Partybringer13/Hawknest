version: "3.8"

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - LOG_CONFS=true
    volumes:
      - /mnt/software/ix-applications/wireguard:/config
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped
