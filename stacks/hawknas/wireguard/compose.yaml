version: "3.8"

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: "host"            # fastest for throughput on SCALE 25.10
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Chicago
      - LOG_CONFS=true
    volumes:
      - /mnt/software/ix-applications/wireguard:/config
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped
    cpuset: "4-9"                   # pin container to cores 4-9 (adjust if needed)
