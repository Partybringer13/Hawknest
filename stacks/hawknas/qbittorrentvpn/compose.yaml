networks:
  proxy:
    external: true
services:
  arch-qbittorrentvpn:
    cap_add:
      - NET_ADMIN
    ports:
      - 8080:8080
      - 8118:8118
      - 9118:9118
      - 58946:58946
      - 58946:58946/udp
    container_name: qbittorrentvpn
    restart: unless-stopped
    volumes:
      - /mnt/software/opt/downloads:/downloads
      - /mnt/software/ix-applications/QBITTORRENT_DIR:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - VPN_ENABLED=no
      - VPN_USER=ZG6Nqjj6LpecCZCiqadChhaj
      - VPN_PASS=exsiYyeAHPhPqEHG5qc7QDz7
      - VPN_PROV=custom
      - VPN_CLIENT=openvpn
      - ENABLE_STARTUP_SCRIPTS=no
      - ENABLE_PRIVOXY=yes
      - STRICT_PORT_FORWARD=no
      - USERSPACE_WIREGUARD=no
      - ENABLE_SOCKS=no
      - SOCKS_USER=admin
      - SOCKS_PASS=socks
      - LAN_NETWORK=192.168.0.0/24, 192.168.1.0/24, 172.16.0.0/16
      - NAME_SERVERS=103.86.96.103
      - VPN_INPUT_PORTS=0
      - VPN_OUTPUT_PORTS=0
      - DEBUG=false
      - WEBUI_PORT=8080
      - UMASK=000
      - PUID=568
      - PGID=568
    networks:
      - proxy
    image: binhex/arch-qbittorrentvpn
