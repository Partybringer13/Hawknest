services:
  valheim:
    image: mbround18/valheim:latest
    container_name: valheim
    restart: unless-stopped

    ports:
      - 2456:2456/udp
      - 2457:2457/udp
      - 2458:2458/udp

    environment:
      PORT: 2456
      NAME: "Welcome to HawkHeim"
      WORLD: "HawkHeim"
      PASSWORD: "getsome"
      TZ: "America/Chicago"
      PUBLIC: 0
      TYPE: "BepInEx"
      MODS: |
        https://github.com/Grantapher/ValheimPlus/releases/download/0.9.17.1/ValheimPlus.dll

      AUTO_UPDATE: 1
      AUTO_UPDATE_SCHEDULE: "0 1 * * *"
      UPDATE_ON_STARTUP: 0

      AUTO_BACKUP: 1
      AUTO_BACKUP_SCHEDULE: "*/15 * * * *"
      AUTO_BACKUP_REMOVE_OLD: 1
      AUTO_BACKUP_DAYS_TO_LIVE: 3
      AUTO_BACKUP_ON_UPDATE: 1
      AUTO_BACKUP_ON_SHUTDOWN: 1

      #BEPINEX: 1
      #ODIN: 1
      #ODIN_INSTALL: "ValheimPlus-ValheimPlus"

    volumes:
      - ./valheim/saves:/home/steam/.config/unity3d/IronGate/Valheim
      - ./valheim/server:/home/steam/valheim
      - ./valheim/backups:/home/steam/backups
